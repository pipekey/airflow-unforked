---
# AMD CI workflow. Triggered on every PR, on the canary cron, and on release branches by
# `release-branch-ci.yml`. Companion to `ci-arm.yml`, which runs the same pipeline on ARM as the
# scheduled canary. The two workflows are physical copies of each other
# (GitHub Actions has no cross-file YAML include), differing only in their
# trigger surface, the hardcoded `platform` value in `build-info`'s outputs
# (and the `PLATFORM` selective checks pick the runner type for), and the
# architecture-specific print-platform job.
# Edit both files together when changing pipeline shape.
name: Tests (AMD)
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - v[0-9]+-[0-9]+-test
      - v[0-9]+-[0-9]+-stable
      - providers-[a-z]+-?[a-z]*/v[0-9]+-[0-9]+
      - chart/v[0-9]+-[0-9]+x-test
      - chart/v[0-9]+-[0-9]+x-stable
      - airflow-ctl/v[0-9]+-[0-9]+-test
      - airflow-ctl/v[0-9]+-[0-9]+-stable
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    # Every push triggers the workflow so that contributors get CI in their forks (AIP-120).
    # In apache/airflow the `gate` job keeps the old behaviour: only pushes to the release-prep /
    # providers branches in CANONICAL_PUSH_BRANCH_FILTERS (fork_ci_gate.py) run anything, and they
    # run only the tests needed by the changes since the last successful run of the branch
    # (selected as for a PR); other pushes produce a gate-only run. Full runs of these branches, on
    # AMD and ARM, are dispatched by `release-branch-ci.yml`. `main` does not build on push; its
    # full runs are the canary above.
    branches:
      - '**'
  workflow_dispatch:
permissions:
  # All other permissions are set to none by default
  contents: read
env:
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_USERNAME: ${{ github.actor }}
  JAVA_VERSION: '11'
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  VERBOSE: "true"

concurrency:
  # Push runs have a group of their own per branch: a newer push cancels the older push run (the
  # newer run then also tests the cancelled run's changes, see `check-run-needed`), and a push never
  # cancels a full run of the branch.
  group: >-
    ci-amd-${{ github.event.pull_request.number || github.ref }}${{
    github.event_name == 'push' && '-push' || '' }}
  # A scheduled canary queues behind a run in progress instead of cancelling it: it may well be a
  # manual run of the same commit, which the canary would otherwise cancel and then skip itself.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  check-run-needed:
    name: "Check if the run is needed"
    # A scheduled canary is not needed when the last completed full run of this workflow on the
    # branch tested the same commit and succeeded: it would only repeat that run. A push run tests
    # the changes since the last successful run of this workflow on the branch, found here.
    # This job runs for every event, with no steps for the others: every other job depends on it
    # through `build-info`, and GitHub skips the whole dependency chain below a skipped job unless
    # each job in it has a status function such as `always()` in its `if:`.
    runs-on: ["ubuntu-slim"]
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run-needed: ${{ steps.schedule.outputs.run-needed || 'true' }}
      # Empty in forks, whose pushes selective checks compare against apache/airflow.
      push-base-commit: ${{ steps.push.outputs.push-base-commit }}
    steps:
      - name: "Find the last successful run of the branch"
        if: github.event_name == 'push' && github.repository == 'pipekey/airflow-unforked'
        id: push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          workflow_path="${WORKFLOW_REF%@*}"
          # A successful push or full run tested everything up to its commit. Changes after it -- from
          # pushes whose runs failed, or were cancelled by a newer push -- are all tested by this run.
          # A successful run of this same commit is passed over, so that a re-run tests again.
          if ! base="$(gh api "repos/${REPOSITORY}/actions/workflows/${workflow_path##*/}/runs" -X GET \
            -f branch="${BRANCH}" -f status=success -F per_page=30 \
            --jq "[.workflow_runs[] | select((.event == \"push\" or .event == \"workflow_dispatch\")
                  and .head_sha != \"${GITHUB_SHA}\")][0].head_sha // \"\"")"; then
            # Fail open: a failed lookup must not skip the run.
            echo "::warning::Could not find the last successful run of ${BRANCH}, all tests will run"
            base=""
          fi
          # With no successful run to build on, selective checks run all tests.
          echo "push-base-commit=${base}" >> "${GITHUB_OUTPUT}"
          echo "Testing the changes since ${base:-the start: no successful run yet, so all tests run}." \
            >> "${GITHUB_STEP_SUMMARY}"
      - name: "Check the last full run of ${{ github.sha }}"
        if: github.event_name == 'schedule'
        id: schedule
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A fork that enables Actions for fork CI also gets this cron; its canary would only use
          # the contributor's runners. `ci-amd.yml`'s gate skips it too (`fork_schedule`).
          if [[ "${REPOSITORY}" != "pipekey/airflow-unforked" ]]; then
            echo "run-needed=false" >> "${GITHUB_OUTPUT}"
            echo "Scheduled canaries run only in apache/airflow." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          workflow_path="${WORKFLOW_REF%@*}"
          workflow="${workflow_path##*/}"
          # Full runs are the scheduled canaries and manual `workflow_dispatch` runs; this run is
          # still in progress, so `status=completed` leaves it out.
          if ! last="$(gh api \
            "repos/${REPOSITORY}/actions/workflows/${workflow}/runs?branch=${BRANCH}&status=completed" \
            -F per_page=20 -X GET \
            --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")][0]
                  | "\(.head_sha // "") \(.conclusion // "") \(.html_url // "")"')"; then
            # Fail open: a canary that cannot check the last run runs, and reports to Slack.
            echo "::warning::Could not find the last full run of ${BRANCH}, running the canary"
            last=""
          fi
          read -r last_sha last_conclusion last_url <<< "${last}"
          if [[ "${last_sha}" == "${GITHUB_SHA}" && "${last_conclusion}" == "success" ]]; then
            echo "run-needed=false" >> "${GITHUB_OUTPUT}"
            echo "No new commits since the last successful full run: ${last_url}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "run-needed=true" >> "${GITHUB_OUTPUT}"
          fi

  gate:
    # Fork CI gate (AIP-120): decides whether project CI runs for this event. Configuration and
    # code come from the base branch so a pull request cannot change its own eligibility. See
    # dev/breeze/doc/ci/08_fork_ci_for_external_contributors.md. A pull request whose CI runs
    # in the contributor's fork and changes this job, how build-info depends on it, any job that
    # runs when it skips build-info (such as ci-passed), or the name of any job is closed by the
    # fork CI monitor ("Gate protection" in that document).
    name: "Fork CI gate"
    runs-on: ["ubuntu-slim"]
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads the creation time of this run, which decides for a pilot's older pull request.
      actions: read
    outputs:
      project-ci: ${{ steps.gate.outputs.project-ci }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: "Checkout gate configuration from the base branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A push in apache/airflow has no base branch. Its decision depends only on the pushed
          # ref, so it takes the gate from the default branch: a pushed branch without the gate
          # files would otherwise look like `base_without_gate` and run project CI on a push that
          # never triggered it. A push in a fork keeps the pushed commit's gate, by SHA: the fork's
          # default branch, or a later tip of the pushed branch picked up by a re-run, is the
          # contributor's to change outside the commit whose result the reconciler trusts, while
          # a gate change in the pushed commit shows in the pull request's files.
          ref: >-
            ${{ github.base_ref ||
            (github.event_name == 'push' && github.repository == 'pipekey/airflow-unforked' &&
            github.event.repository.default_branch) ||
            (github.event_name == 'push' && github.sha) ||
            github.ref }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/fork-ci-gate.toml
            dev/breeze/src/airflow_breeze/utils/fork_ci_gate.py
            scripts/ci/prek/check_no_conventional_commit_message.py
          sparse-checkout-cone-mode: false
      # Until the gate is on the default branch, a push in apache/airflow would find no gate there
      # and run the full project CI as `base_without_gate`, for every branch pushed. Only
      # committers can push to apache/airflow, so the pushed commit's own gate decides then.
      - name: "Check whether the default branch has the gate"
        id: default-branch-gate
        if: github.event_name == 'push' && github.repository == 'pipekey/airflow-unforked'
        env:
          GATE_CONFIG: .github/fork-ci-gate.toml
          GATE_SCRIPT: dev/breeze/src/airflow_breeze/utils/fork_ci_gate.py
        run: |
          if [[ -e "${GATE_CONFIG}" || -e "${GATE_SCRIPT}" ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: "Checkout gate configuration from the pushed commit"
        if: steps.default-branch-gate.outputs.present == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/fork-ci-gate.toml
            dev/breeze/src/airflow_breeze/utils/fork_ci_gate.py
            scripts/ci/prek/check_no_conventional_commit_message.py
          sparse-checkout-cone-mode: false
      - name: "Decide whether project CI runs"
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_CONFIG: .github/fork-ci-gate.toml
          GATE_SCRIPT: dev/breeze/src/airflow_breeze/utils/fork_ci_gate.py
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
        # A base branch with neither gate file predates the gate (the pull request adding it,
        # or a release branch cut before it) and keeps running project CI. With only one of
        # them present, the missing file fails the job instead of opening the gate.
        run: |
          if [[ ! -e "${GATE_CONFIG}" && ! -e "${GATE_SCRIPT}" ]]; then
            echo "project-ci=true reason=base_without_gate"
            echo "project-ci=true" >> "${GITHUB_OUTPUT}"
            echo "reason=base_without_gate" >> "${GITHUB_OUTPUT}"
            echo 'Project CI runs (fork CI gate reason: `base_without_gate`)' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          python3 "${GATE_SCRIPT}"
      # A gated pull request skips ci-image-checks.yml, which checks the title on project CI, and
      # its fork run is a `push` event without a title.
      - name: "Check PR title is not Conventional Commits"
        if: github.event_name == 'pull_request' && steps.gate.outputs.project-ci == 'false'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" \
            | python3 scripts/ci/prek/check_no_conventional_commit_message.py --from-stdin

  build-info:
    name: "Build info"
    needs: [gate, check-run-needed]
    if: >-
      needs.gate.outputs.project-ci == 'true' &&
      needs.check-run-needed.outputs.run-needed == 'true'
    # At build-info stage we do not yet have outputs so the runs-on is hard-coded. ubuntu-slim is enough:
    # it only installs breeze and runs selective checks, which need neither docker nor freeing disk space.
    runs-on: ["ubuntu-slim"]
    outputs:
      all-python-versions-list-as-string: >-
        ${{ steps.selective-checks.outputs.all-python-versions-list-as-string }}
      arm-runners: ${{ steps.selective-checks.outputs.arm-runners }}
      basic-checks-only: ${{ steps.selective-checks.outputs.basic-checks-only }}
      canary-run: ${{ steps.source-run-info.outputs.canary-run }}
      ci-image-build: ${{ steps.selective-checks.outputs.ci-image-build }}
      core-test-types-list-as-strings-in-json: >-
        ${{ steps.selective-checks.outputs.core-test-types-list-as-strings-in-json }}
      debug-resources: ${{ steps.selective-checks.outputs.debug-resources }}
      default-branch: ${{ steps.selective-checks.outputs.default-branch }}
      default-constraints-branch: ${{ steps.selective-checks.outputs.default-constraints-branch }}
      default-helm-version: ${{ steps.selective-checks.outputs.default-helm-version }}
      default-kind-version: ${{ steps.selective-checks.outputs.default-kind-version }}
      default-kubernetes-version: ${{ steps.selective-checks.outputs.default-kubernetes-version }}
      default-mysql-version: ${{ steps.selective-checks.outputs.default-mysql-version }}
      default-postgres-version: ${{ steps.selective-checks.outputs.default-postgres-version }}
      default-python-version: ${{ steps.selective-checks.outputs.default-python-version }}
      disable-airflow-repo-cache: ${{ steps.selective-checks.outputs.disable-airflow-repo-cache }}
      docker-cache: ${{ steps.selective-checks.outputs.docker-cache }}
      use-pinned-os-deps-images: ${{ steps.selective-checks.outputs.use-pinned-os-deps-images }}
      docs-build: ${{ steps.selective-checks.outputs.docs-build }}
      docs-list-as-string: ${{ steps.selective-checks.outputs.docs-list-as-string }}
      excluded-providers-as-string: ${{ steps.selective-checks.outputs.excluded-providers-as-string }}
      force-pip: ${{ steps.selective-checks.outputs.force-pip }}
      full-tests-needed: ${{ steps.selective-checks.outputs.full-tests-needed }}
      has-migrations: ${{ steps.selective-checks.outputs.has-migrations }}
      helm-test-packages: ${{ steps.selective-checks.outputs.helm-test-packages }}
      helm-test-kubernetes-versions: ${{ steps.selective-checks.outputs.helm-test-kubernetes-versions }}
      include-success-outputs: ${{ steps.selective-checks.outputs.include-success-outputs }}
      individual-providers-test-types-list-as-strings-in-json: >-
        ${{ steps.selective-checks.outputs.individual-providers-test-types-list-as-strings-in-json }}
      java-sdk-version: ${{ steps.selective-checks.outputs.java-sdk-version }}
      kubernetes-combos: ${{ steps.selective-checks.outputs.kubernetes-combos }}
      kubernetes-combos-list-as-string: >-
        ${{ steps.selective-checks.outputs.kubernetes-combos-list-as-string }}
      kubernetes-versions-list-as-string: >-
        ${{ steps.selective-checks.outputs.kubernetes-versions-list-as-string }}
      kustomize-overlay-names: ${{ steps.selective-checks.outputs.kustomize-overlay-names }}
      lang-sdk-conformance-sdks: ${{ steps.selective-checks.outputs.lang-sdk-conformance-sdks }}
      run-kustomize-overlays-tests: ${{ steps.selective-checks.outputs.run-kustomize-overlays-tests }}
      latest-versions-only: ${{ steps.selective-checks.outputs.latest-versions-only }}
      mysql-exclude: ${{ steps.selective-checks.outputs.mysql-exclude }}
      mysql-versions: ${{ steps.selective-checks.outputs.mysql-versions }}
      newsfragment-pr-number: ${{ steps.newsfragment-pr.outputs.pr-number }}
      # platform is hardcoded per workflow file (this is the
      # AMD copy). The matching ARM copy lives in ci-arm.yml.
      platform: "linux/amd64"
      postgres-exclude: ${{ steps.selective-checks.outputs.postgres-exclude }}
      postgres-versions: ${{ steps.selective-checks.outputs.postgres-versions }}
      prod-image-build: ${{ steps.selective-checks.outputs.prod-image-build }}
      # yamllint disable rule:line-length
      providers-compatibility-tests-matrix: >
        ${{ steps.selective-checks.outputs.providers-compatibility-tests-matrix }}
      providers-test-types-list-as-strings-in-json: >-
        ${{ steps.selective-checks.outputs.providers-test-types-list-as-strings-in-json }}
      providers-split-test-types-list-as-strings-in-json: >-
        ${{ steps.selective-checks.outputs.providers-split-test-types-list-as-strings-in-json }}
      providers-xdist-test-types-list-as-strings-in-json: >-
        ${{ steps.selective-checks.outputs.providers-xdist-test-types-list-as-strings-in-json }}
      pull-request-labels: ${{ steps.source-run-info.outputs.pr-labels }}
      python-versions-list-as-string: ${{ steps.selective-checks.outputs.python-versions-list-as-string }}
      python-versions: ${{ steps.selective-checks.outputs.python-versions }}
      run-agent-framework-tests: ${{ steps.selective-checks.outputs.run-agent-framework-tests }}
      run-airflow-ctl-tests: ${{ steps.selective-checks.outputs.run-airflow-ctl-tests }}
      run-airflow-ctl-integration-tests: ${{ steps.selective-checks.outputs.run-airflow-ctl-integration-tests }}
      run-generic-basic-tests: ${{ steps.selective-checks.outputs.run-generic-basic-tests }}
      run-generic-prod-image-tests: ${{ steps.selective-checks.outputs.run-generic-prod-image-tests }}
      run-amazon-tests: ${{ steps.selective-checks.outputs.run-amazon-tests }}
      run-api-codegen: ${{ steps.selective-checks.outputs.run-api-codegen }}
      run-api-tests: ${{ steps.selective-checks.outputs.run-api-tests }}
      run-coverage: ${{ steps.source-run-info.outputs.run-coverage }}
      run-go-sdk-tests: ${{ steps.selective-checks.outputs.run-go-sdk-tests }}
      run-java-sdk-tests: ${{ steps.selective-checks.outputs.run-java-sdk-tests }}
      run-ts-sdk-tests: ${{ steps.selective-checks.outputs.run-ts-sdk-tests }}
      run-ts-sdk-docs: ${{ steps.selective-checks.outputs.run-ts-sdk-docs }}
      run-helm-tests: ${{ steps.selective-checks.outputs.run-helm-tests }}
      run-kubernetes-tests: ${{ steps.selective-checks.outputs.run-kubernetes-tests }}
      run-mypy-providers: ${{ steps.selective-checks.outputs.run-mypy-providers }}
      run-remote-logging-elasticsearch-e2e-tests: ${{ steps.selective-checks.outputs.run-remote-logging-elasticsearch-e2e-tests }}
      run-remote-logging-opensearch-e2e-tests: ${{ steps.selective-checks.outputs.run-remote-logging-opensearch-e2e-tests }}
      run-remote-logging-s3-e2e-tests: ${{ steps.selective-checks.outputs.run-remote-logging-s3-e2e-tests }}
      run-event-driven-e2e-tests: ${{ steps.selective-checks.outputs.run-event-driven-e2e-tests }}
      run-java-sdk-e2e-tests: ${{ steps.selective-checks.outputs.run-java-sdk-e2e-tests }}
      run-go-sdk-e2e-tests: ${{ steps.selective-checks.outputs.run-go-sdk-e2e-tests }}
      run-openlineage-e2e-tests: ${{ steps.selective-checks.outputs.run-openlineage-e2e-tests }}
      run-openlineage-e2e-compat-tests: ${{ steps.selective-checks.outputs.run-openlineage-e2e-compat-tests }}
      run-ts-sdk-e2e-tests: ${{ steps.selective-checks.outputs.run-ts-sdk-e2e-tests }}
      run-yaml-dag-e2e-tests: ${{ steps.selective-checks.outputs.run-yaml-dag-e2e-tests }}
      run-system-tests: ${{ steps.selective-checks.outputs.run-system-tests }}
      run-task-sdk-tests: ${{ steps.selective-checks.outputs.run-task-sdk-tests }}
      run-task-sdk-integration-tests: ${{ steps.selective-checks.outputs.run-task-sdk-integration-tests }}
      run-breeze-integration-tests: ${{ steps.selective-checks.outputs.run-breeze-integration-tests }}
      run-scripts-tests: ${{ steps.selective-checks.outputs.run-scripts-tests }}
      runner-type: ${{ steps.selective-checks.outputs.runner-type }}
      in-memory-runner-type: ${{ steps.selective-checks.outputs.in-memory-runner-type }}
      run-ui-tests: ${{ steps.selective-checks.outputs.run-ui-tests }}
      run-ui-e2e-tests: ${{ steps.selective-checks.outputs.run-ui-e2e-tests }}
      run-unit-tests: ${{ steps.selective-checks.outputs.run-unit-tests }}
      run-www-tests: ${{ steps.selective-checks.outputs.run-www-tests }}
      selected-providers-list-as-string: >-
        ${{ steps.selective-checks.outputs.selected-providers-list-as-string }}
      shared-distributions-as-json: ${{ steps.selective-checks.outputs.shared-distributions-as-json }}
      skip-prek-hooks: ${{ steps.selective-checks.outputs.skip-prek-hooks }}
      skip-providers-tests: ${{ steps.selective-checks.outputs.skip-providers-tests }}
      source-head-repo: ${{ steps.source-run-info.outputs.head-repo }}
      source-head-ref: ${{ steps.source-run-info.outputs.head-ref }}
      sqlite-exclude: ${{ steps.selective-checks.outputs.sqlite-exclude }}
      testable-core-integrations: ${{ steps.selective-checks.outputs.testable-core-integrations }}
      testable-providers-integrations: ${{ steps.selective-checks.outputs.testable-providers-integrations }}
      use-uv: ${{ steps.selective-checks.outputs.force-pip == 'true' && 'false' || 'true' }}
      upgrade-to-newer-dependencies: ${{ steps.selective-checks.outputs.upgrade-to-newer-dependencies }}
      is-uv-lock-update: ${{ steps.selective-checks.outputs.is-uv-lock-update }}
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch incoming commit ${{ github.sha }} with its parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: "Fetch the last tested push commit"
        # Selective checks of a push diff against this commit. A two-commit diff only needs the
        # commit itself, not the history in between; if it cannot be fetched, all tests run.
        if: needs.check-run-needed.outputs.push-base-commit != ''
        shell: bash
        env:
          PUSH_BASE_COMMIT: ${{ needs.check-run-needed.outputs.push-base-commit }}
        run: |
          git fetch --no-tags --depth=1 origin "${PUSH_BASE_COMMIT}" \
            || echo "::warning::Could not fetch ${PUSH_BASE_COMMIT}, all tests will run"
      - name: "Install Breeze"
        uses: ./.github/actions/breeze
        with:
          free-space: "false"
        id: breeze
      - name: "Save github context to file"
        # The github context can be very large for PRs that touch many files (e.g. Dependabot
        # bumps with dozens of packages). Passing it as an env var would exceed ARG_MAX and
        # prevent subsequent steps from starting bash, so we write it to a file once here and
        # let downstream breeze invocations read it via GITHUB_CONTEXT_INPUT.
        #
        # Zizmor flags this as template-injection because attacker-controllable fields in the
        # github context (PR title, body, branch names) are pasted into a `run:` script. It is
        # a false positive in this specific shape:
        #   * the substituted JSON sits inside a SINGLE-QUOTED heredoc (`<< '__GITHUB_CONTEXT_END__'`),
        #     which disables ALL bash expansion -- $(...), `...`, ${...}, and even `\` are literal,
        #     so no shell metacharacter in the JSON can be evaluated;
        #   * the only remaining escape is the delimiter `__GITHUB_CONTEXT_END__` appearing on a
        #     line by itself in the JSON. `toJson` escapes newlines inside string values as `\n`
        #     (so they are NOT real newlines in the script source), and the delimiter is unique
        #     enough that github will never produce it as a structural line of the JSON output;
        #   * `cat` writes the bytes verbatim to a file -- it is not eval'd.
        # Whatever junk a malicious PR puts in title/body therefore lands inside a JSON file
        # consumed by breeze, never executed as shell.
        shell: bash
        run: |  # zizmor: ignore[template-injection]
          cat > "${RUNNER_TEMP}/github_context.json" << '__GITHUB_CONTEXT_END__'
          ${{ toJson(github) }}
          __GITHUB_CONTEXT_END__
      - name: "Get information about the Workflow"
        id: source-run-info
        run: breeze ci get-workflow-info 2>> ${GITHUB_OUTPUT}
        env:
          SKIP_BREEZE_SELF_UPGRADE_CHECK: "true"
          GITHUB_CONTEXT_INPUT: "${{ runner.temp }}/github_context.json"
      # The newsfragment check of static checks fails a newsfragment of the pull request that is
      # named after another number. A push in a fork (AIP-120) has no pull request in its event,
      # so the open pull request of the pushed branch is looked up; without one, any number passes.
      - name: "Find the pull request for the newsfragment check"
        id: newsfragment-pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          number=""
          # A pull request inside a fork has a number of the fork's, not of apache/airflow.
          if [[ "${EVENT_NAME}" == "pull_request" && "${BASE_REF}" == "main" \
              && "${REPOSITORY}" == "pipekey/airflow-unforked" ]]; then
            number="${EVENT_PR_NUMBER}"
          elif [[ "${EVENT_NAME}" == "push" && "${REPOSITORY}" != "pipekey/airflow-unforked" ]]; then
            number=$(gh api -X GET repos/pipekey/airflow-unforked/pulls -f head="${OWNER}:${REF_NAME}" \
              -f state=open -f base=main --jq '.[0].number // empty' || true)
          fi
          if [[ "${number}" =~ ^[0-9]+$ ]]; then
            echo "pr-number=${number}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Selective checks
        id: selective-checks
        env:
          PR_LABELS: "${{ steps.source-run-info.outputs.pr-labels }}"
          COMMIT_REF: "${{ github.sha }}"
          VERBOSE: "false"
          GITHUB_CONTEXT_INPUT: "${{ runner.temp }}/github_context.json"
          # Repository variable: "true" moves every run, pushes included, back to public runners.
          USE_PUBLIC_RUNNERS: "${{ vars.USE_PUBLIC_RUNNERS }}"
          # Repository variable: "false" keeps docker of the RunsOn jobs on disk instead of in RAM.
          USE_IN_MEMORY_DOCKER: "${{ vars.USE_IN_MEMORY_DOCKER }}"
          PLATFORM: "linux/amd64"
          SELECTIVE_TESTS_ON_PUSH: "true"
          PUSH_BASE_COMMIT: ${{ needs.check-run-needed.outputs.push-base-commit }}
        run: breeze ci selective-check 2>> ${GITHUB_OUTPUT}
      - name: env
        run: printenv
        env:
          PR_LABELS: ${{ steps.source-run-info.outputs.pr-labels }}

  quick-tests:
    # SIMULATION ONLY (pipekey/airflow-unforked): stands in for the whole test matrix of ci-amd.yml.
    name: "Quick tests"
    needs: [build-info]
    runs-on: ["ubuntu-slim"]
    timeout-minutes: 5
    steps:
      - name: "Pass, or fail when the head commit message asks for it"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "${COMMIT_MESSAGE}${PR_TITLE}" == *"[sim-fail]"* ]]; then
            echo "Failing on purpose ([sim-fail])."
            exit 1
          fi
          echo "Quick tests passed."

  ci-passed:
    # A skipped build-info means project CI did not run at all: the fork CI gate (AIP-120) left the
    # pull request to CI in the contributor's fork, and every job here is skipped. Reporting
    # "CI passed" then would let it merge on no CI, so the job reports under another name and
    # the fork CI reconciler posts "CI passed" from the fork run instead.
    # A run with cancelled jobs and no failed one -- usually a duplicate run of the same commit that
    # concurrency cancelled, such as the two `synchronize` events GitHub sends when a stacked pull
    # request's base and head are force-pushed together -- reports under another name too, so it
    # never puts a failed "CI passed" next to the passing one of its twin. "CI passed" is then
    # missing for that run, which keeps the merge blocked until another run of the commit reports it.
    # A job cancelled by its timeout, while the run is not, makes `check-timed-out-jobs` fail, and
    # so this job fails.
    name: >-
      ${{ (!contains(needs.*.result, 'failure') && contains(needs.*.result, 'cancelled') &&
      'CI passed (run cancelled)') ||
      (needs.build-info.result == 'skipped' && 'CI passed (project CI not run)') || 'CI passed' }}
    # The one check main's ruleset requires, so auto-merge waits for CI to finish. GitHub treats a
    # skipped required check as passed, so this job always runs and fails itself when any job it
    # needs failed or timed out. Jobs skipped by selective checks count as passed.
    if: always()
    needs:
      - build-info
      - check-run-needed
      - gate
      - quick-tests
    runs-on: ["ubuntu-slim"]
    steps:
      - name: "Fail if any CI job failed"
        if: contains(needs.*.result, 'failure')
        run: |
          echo "At least one CI job failed."
          exit 1
      - name: "Report that CI jobs were cancelled"
        if: contains(needs.*.result, 'cancelled')
        run: |
          echo "At least one CI job was cancelled, so this run does not report CI passed."
          echo 'CI jobs were cancelled: this run does not report `CI passed`.' >> "${GITHUB_STEP_SUMMARY}"
      - name: "All CI jobs passed or were skipped"
        if: "!contains(needs.*.result, 'cancelled')"
        run: echo "All CI jobs passed or were skipped."
